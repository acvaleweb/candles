name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and test
        run: make CC=${{ matrix.compiler }} check
      - name: Address and undefined-behavior sanitizers
        run: make CC=${{ matrix.compiler }} check-sanitize
